<body>

            <text x="10" y="46" font-family="'Geist', sans-serif" font-size="8.5" fill="#252B36">Dispatches user, course,</text>
            <text x="10" y="58" font-family="'Geist', sans-serif" font-size="8.5" fill="#252B36">and enrolment triggers</text>
          </g>

          <!-- 2. Access / Capabilities -->

            <text x="10" y="58" font-family="'Geist', sans-serif" font-size="8.5" fill="#252B36">permission checking</text>

            <text x="10" y="18" font-family="'Geist Mono', monospace" font-size="8" font-weight="700" fill="#252B36">USERS &amp; AUTH</text>
            <text x="10" y="32" font-family="'Geist', sans-serif" font-size="9" fill="#657080">core_user / auth_*</text>
            <text x="10" y="46" font-family="'Geist', sans-serif" font-size="8.5" fill="#252B36">Account lifecycles,</text>
            <text x="10" y="58" font-family="'Geist', sans-serif" font-size="8.5" fill="#252B36">sessions &amp; user profiles</text>

            <text x="10" y="58" font-family="'Geist', sans-serif" font-size="8.5" fill="#252B36">expiry, course access</text>
          </g>

            <text x="10" y="46" font-family="'Geist', sans-serif" font-size="8.5" fill="#252B36">Adhoc queues &amp;</text>
            <text x="10" y="58" font-family="'Geist', sans-serif" font-size="8.5" fill="#252B36">scheduled cron runners</text>

            <text x="10" y="58" font-family="'Geist', sans-serif" font-size="8.5" fill="#252B36">mobile token service</text>

            <text x="10" y="58" font-family="'Geist', sans-serif" font-size="8.5" fill="#252B36">NRPS roster provisioning</text>

          <text x="16" y="60" font-family="'Geist', sans-serif" font-size="9.5" fill="#657080">and minor version updates apply cleanly via git with zero custom regression testing.</text>

            <text x="10" y="36" font-family="'Geist', sans-serif" font-size="8.5" fill="#657080">/lib, /course, /user, /enrol</text>
            <text x="10" y="50" font-family="'Geist', sans-serif" font-size="8.5" fill="#657080">files remain untouched</text>

            <rect x="215" y="0" width="205" height="65" rx="2" fill="rgba(37,43,54,0.02)" stroke="rgba(37,43,54,0.1)"/>
            <text x="225" y="20" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#252B36">OFFICIAL API HOOKS</text>
            <text x="225" y="36" font-family="'Geist', sans-serif" font-size="8.5" fill="#657080">Uses supported events, tasks,</text>
            <text x="225" y="50" font-family="'Geist', sans-serif" font-size="8.5" fill="#657080">and XMLDB abstractions</text>
          </g>
        </g>
