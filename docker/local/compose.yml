name: acuitey-local

# Local development ONLY. No production hosts, no TLS proxy flags.
# Usage (from repository root). NOTE: plain `config` prints interpolated
# secrets — always validate with --quiet:
#   docker compose -f docker/local/compose.yml --env-file docker/local/.env config --quiet
#   docker compose -f docker/local/compose.yml --env-file docker/local/.env up -d --build db redis app

services:
  db:
    image: postgres:16-bookworm
    container_name: acuitey-local-db
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moodle}
      POSTGRES_USER: ${POSTGRES_USER:-moodle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/local/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port mapping: reachable only inside this Compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  redis:
    image: redis:7-bookworm
    container_name: acuitey-local-redis
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    # Ephemeral dev cache: persistence disabled on purpose. Backed by no volume.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    # No host port mapping: reachable only inside this Compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: acuitey-local-app:8.3
    container_name: acuitey-local-app
    restart: unless-stopped
    mem_limit: 2g
    cpus: 4.0
    # Localhost-only web binding. Never 0.0.0.0 on a dev laptop.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      # Live Moodle source for development (read-write for theme work and the
      # git-ignored moodle/config.php). Core files must still not be edited.
      - ../../moodle:/var/www/moodle:rw
      # Persistent moodledata OUTSIDE the webroot.
      - moodledata:/var/moodledata
    environment:
      MOODLE_DB_HOST: ${MOODLE_DB_HOST:-db}
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?Set MOODLE_DB_PASSWORD in docker/local/.env}
      MOODLE_DB_PREFIX: ${MOODLE_DB_PREFIX:-mdl_}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
      MOODLE_DATAROOT: /var/moodledata
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Lenient: cold Moodle cache builds on a Windows bind-mount can take a
      # while. Pre-install reply is HTTP 303 (redirect into the installer).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 90s
    networks:
      - internal

  # Recurring Moodle cron. DO NOT START until Moodle is installed.
  # Start explicitly: docker compose -f docker/local/compose.yml --env-file docker/local/.env --profile cron up -d cron
  cron:
    build:
      context: .
      dockerfile: Dockerfile
    image: acuitey-local-app:8.3
    container_name: acuitey-local-cron
    profiles: ["cron"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    # Run as www-data (same uid as Apache) so cron-created dataroot files stay
    # Apache-writable. The entrypoint chown is tolerant of non-root (see
    # scripts/docker-entrypoint.sh).
    user: www-data
    command: ["/usr/local/bin/moodle-cron.sh"]
    volumes:
      - ../../moodle:/var/www/moodle:rw
      - moodledata:/var/moodledata
    environment:
      MOODLE_DB_HOST: ${MOODLE_DB_HOST:-db}
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?Set MOODLE_DB_PASSWORD in docker/local/.env}
      MOODLE_DB_PREFIX: ${MOODLE_DB_PREFIX:-mdl_}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
      MOODLE_DATAROOT: /var/moodledata
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
    name: acuitey-local-pgdata
  moodledata:
    name: acuitey-local-moodledata

networks:
  internal:
    name: acuitey-local-net
    driver: bridge
