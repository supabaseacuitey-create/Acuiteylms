<VirtualHost *:80>
    ServerName localhost

    # Moodle 5.2 webroot: ONLY the public directory is exposed to HTTP.
    DocumentRoot /var/www/moodle/public

    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php index.html

    ErrorLog ${APACHE_LOG_DIR}/acuitey-error.log
    CustomLog ${APACHE_LOG_DIR}/acuitey-access.log combined
</VirtualHost>
