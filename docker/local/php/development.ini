; Acuitey LMS local development PHP settings.
; Production values (opcache validate_timestamps=0, display_errors=Off, TLS
; proxy flags) MUST be set separately; this file is development-only.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Moodle requires max_input_vars >= 5000.
max_input_vars = 5000

; Development-appropriate limits (not production sizing).
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 300

; Timezone intentionally unset: do not hard-code IST or any zone on behalf
; of the client (see prompt.md ACU-BASE-001). PHP default applies.

; OPcache on, but timestamp validation ON so bind-mounted code edits reload
; without a container restart (production must use validate_timestamps=0).
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 256M
opcache.max_accelerated_files = 10000
