<VirtualHost *:80>
    ServerName localhost

    # Moodle 5.2 webroot: ONLY the public directory is exposed to HTTP.
    # TLS terminates at Traefik (Coolify); this vhost serves plain HTTP
    # behind it. See moodle-config.php ($CFG->sslproxy).
    DocumentRoot /var/www/moodle/public

    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php index.html
    TraceEnable Off

    # Non-conflicting hardening headers. Frame policy is left to
    # Moodle/Traefik — do not add X-Frame-Options here.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/acuitey-error.log
    CustomLog ${APACHE_LOG_DIR}/acuitey-access.log combined
</VirtualHost>
