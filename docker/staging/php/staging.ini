; Acuitey LMS staging PHP settings (production-like).
; Development overrides (display_errors, timestamp validation) live ONLY in
; docker/local/php/development.ini and must never reach staging.

display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On

; Moodle requires max_input_vars >= 5000.
max_input_vars = 5000

memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 300

; Timezone intentionally unset: do not hard-code any zone on behalf
; of the client (ACU-BASE-001). PHP default applies.

; OPcache production mode: no timestamp checks (code changes require a
; redeploy + container restart, which is the correct staging behavior).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.revalidate_freq = 60
opcache.memory_consumption = 256M
opcache.max_accelerated_files = 10000
